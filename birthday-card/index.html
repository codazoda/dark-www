<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Birthday card collection</title>
  <meta name="description" content="Twelve minimal balloon birthday cards for a special 50th birthday.">
  <link rel="stylesheet" href="style.css">
</head>
<body class="gallery">
  <header class="gallery-head">
    <p class="eyebrow">A birthday collection</p>
    <h1>Happy Birthday</h1>
    <p>Six cards to fold. Six cards to share.</p>
  </header>
  <main>
    <section aria-labelledby="print-heading">
      <div class="section-head"><h2 id="print-heading">Print &amp; fold</h2><p>US Letter · landscape · blank inside</p></div>
      <div class="card-grid" id="print-grid"></div>
    </section>
    <section aria-labelledby="digital-heading">
      <div class="section-head"><h2 id="digital-heading">Send a little joy</h2><p>Direct links · phone friendly · no sound</p></div>
      <div class="card-grid" id="digital-grid"></div>
    </section>
  </main>
  <footer>Made for one wonderful 50th birthday.</footer>
  <script src="cards.js"></script>
</body>
</html>
