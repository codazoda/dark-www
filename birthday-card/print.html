<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Printable birthday card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="print-view">
  <nav class="print-tools" aria-label="Print controls">
    <a href="index.html">← All designs</a>
    <p>Letter · landscape · 100% scale · headers and footers off</p>
    <button type="button" onclick="window.print()">Print this card</button>
  </nav>
  <main class="sheet" id="card" aria-live="polite"><section class="back" aria-label="Blank back"></section><section class="front"><i class="balloon coral" style="left:50%;top:35%"></i><div class="art-greeting">Happy Birthday</div></section></main>
  <script src="cards.js"></script>
</body>
</html>
