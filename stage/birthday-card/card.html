<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Birthday</title>
  <meta name="description" content="A little birthday card, sent with love.">
  <link rel="stylesheet" href="style.css">
</head>
<body class="ecard-view">
  <main id="ecard" class="ecard" aria-live="polite">
    <div class="ecard-art" aria-hidden="true">
      <i class="balloon coral small" style="left:18%;top:23%"></i>
      <i class="balloon gold small" style="left:82%;top:22%"></i>
      <i class="balloon blue small" style="left:25%;top:78%"></i>
      <i class="balloon purple small" style="left:76%;top:76%"></i>
    </div>
    <div class="greeting"><span class="age" aria-hidden="true"></span><h1>Happy Birthday</h1></div>
  </main>
  <noscript><p class="no-script">A little celebration, complete just as it is.</p></noscript>
  <script src="cards.js"></script>
</body>
</html>
