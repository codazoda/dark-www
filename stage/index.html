<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    background: #000;
    color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    line-height: 1.5;
  }
  main { max-width: 34em; margin: 0 auto; }
  h1 { font-size: 1em; letter-spacing: .2em; font-weight: normal; margin: 1em 0 2em; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: 0 0 .4em; }
  a { color: inherit; text-decoration: none; display: block; border: 2px solid #fff; padding: .6em .8em; }
  a:hover, a:focus-visible { background: #fff; color: #000; }
  a:focus-visible { outline: 2px dashed #fff; outline-offset: 3px; }
  p { opacity: .6; margin: 2em 0 0; }
  .note { margin: 0 0 2em; }
  /* The one plain, inline link on the site: stage's way back to live. */
  .back a { display: inline; border: 0; padding: 0; text-decoration: underline; }
  .back a:hover, .back a:focus-visible { background: none; color: inherit; }
</style>
</head>
<body>
<main>
<h1>DARK / STAGE</h1>
<p class="note">Unapproved builds, awaiting review. Comment <code>approve</code> on the issue to ship one.</p>
<ul>
<li><a href="shut-the-box/">Shut the Box (#69)</a></li>
</ul>
<p class="back"><a href="../">Live site</a></p>
</main>
</body>
</html>
