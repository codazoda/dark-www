<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RC Ribbon Game</title>
<meta name="description" content="Steer a tiny RC plane through colored ribbons in this fast, instructions-free browser game. No account, no install, no ads.">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    touch-action: none;
  }
  canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }
  #hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: none;
    justify-content: space-between;
    padding: 8px 12px;
    font-size: clamp(13px, 2.6vw, 18px);
    letter-spacing: .04em;
    pointer-events: none;
    text-shadow: 0 0 4px #000, 0 0 4px #000;
  }
  #stage.playing #hud { display: flex; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
    text-align: center;
    background: rgba(0, 0, 0, .82);
  }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-size: clamp(20px, 5vw, 34px); letter-spacing: .05em; }
  .overlay p { margin: 0; max-width: 34em; font-size: clamp(13px, 2.6vw, 16px); color: rgba(255, 255, 255, .75); }
  .bigbtn {
    font: inherit;
    color: #000;
    background: #fff;
    border: none;
    border-radius: 0;
    padding: 14px 36px;
    font-size: clamp(16px, 3.4vw, 22px);
    font-weight: 700;
    letter-spacing: .08em;
    cursor: pointer;
    min-height: 44px;
  }
  .bigbtn:focus-visible { outline: 3px dashed #fff; outline-offset: 4px; }
  #finalScore { font-size: clamp(15px, 3vw, 20px); }

  #pauseOverlay {
    background: rgba(0, 0, 0, .7);
    font-size: clamp(16px, 4vw, 24px);
    letter-spacing: .08em;
  }

  #touchControls {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  #stage.playing #touchControls { display: flex; }
  #touchControls button {
    font: inherit;
    color: #fff;
    background: rgba(255, 255, 255, .08);
    border: 2px solid #fff;
    border-radius: 8px;
    width: 64px;
    height: 64px;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #touchControls button:active,
  #touchControls button.held {
    background: rgba(255, 255, 255, .3);
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" aria-hidden="true"></canvas>

    <div id="hud">
      <span id="statScore">Score: 0</span>
      <span id="statMisses">Misses left: 3</span>
    </div>

    <div id="touchControls">
      <button id="btnUp" type="button" aria-label="Steer up">&#9650;</button>
      <button id="btnDown" type="button" aria-label="Steer down">&#9660;</button>
    </div>

    <div id="startScreen" class="overlay">
      <h1>RC Ribbon Game</h1>
      <p>Fly your RC plane through the ribbons. Miss three and it's over.<br>
      Up/Down or W/S to steer &middot; or use the on-screen arrows.</p>
      <button id="playBtn" class="bigbtn" type="button" autofocus>Play</button>
    </div>

    <div id="gameOverScreen" class="overlay" hidden>
      <h1>Run Over</h1>
      <p id="finalScore">Score: 0</p>
      <button id="againBtn" class="bigbtn" type="button">Play Again</button>
    </div>

    <div id="pauseOverlay" class="overlay" hidden aria-live="polite">
      <p>Paused</p>
    </div>
  </div>

<script>
(() => {
  "use strict";

  const stage = document.getElementById('stage');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const statScoreEl = document.getElementById('statScore');
  const statMissesEl = document.getElementById('statMisses');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const finalScoreEl = document.getElementById('finalScore');
  const playBtn = document.getElementById('playBtn');
  const againBtn = document.getElementById('againBtn');
  const btnUp = document.getElementById('btnUp');
  const btnDown = document.getElementById('btnDown');

  const RIBBON_COLORS = ['#ff5252', '#ffa726', '#ffee58', '#66bb6a', '#26c6da', '#ec407a', '#42a5f5'];
  const MAX_MISSES = 3;

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Logical (CSS-pixel) stage size. Every game coordinate is derived from
  // this each frame, so the same layout scales to any aspect ratio instead
  // of assuming a fixed canvas resolution.
  let W = 0, H = 0;

  function resize() {
    const rect = stage.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (state.screen !== 'playing') {
      state.planeY = H / 2;
    } else {
      state.planeY = clamp(state.planeY, planeMinY(), planeMaxY());
    }
  }

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function randBetween(lo, hi) { return lo + Math.random() * (hi - lo); }

  function planeX() { return W * 0.16; }
  function planeHalfLen() { return clamp(Math.min(W, H) * 0.09, 18, 34); }
  function planeHalfHeight() { return clamp(Math.min(W, H) * 0.06, 12, 22); }
  function planeMinY() { return planeHalfHeight() + 4; }
  function planeMaxY() { return H - planeHalfHeight() - 4; }

  const state = {
    screen: 'start', // 'start' | 'playing' | 'gameover'
    paused: false,
    planeY: 0,
    planeVy: 0,
    score: 0,
    misses: 0,
    ribbons: [],
    effects: [],
    spawnTimer: 0,
    nextSpawnIn: 0,
    keys: { up: false, down: false },
    touch: { up: false, down: false },
  };

  function resetRun() {
    state.planeY = H / 2;
    state.score = 0;
    state.misses = 0;
    state.ribbons = [];
    state.effects = [];
    state.spawnTimer = 0;
    state.nextSpawnIn = randBetween(0.5, 1.0);
    state.paused = false;
    updateHud();
  }

  function updateHud() {
    statScoreEl.textContent = 'Score: ' + state.score;
    statMissesEl.textContent = 'Misses left: ' + (MAX_MISSES - state.misses);
  }

  function startGame() {
    resetRun();
    state.screen = 'playing';
    stage.classList.add('playing');
    startScreen.hidden = true;
    gameOverScreen.hidden = true;
    pauseOverlay.hidden = true;
  }

  function endGame() {
    state.screen = 'gameover';
    stage.classList.remove('playing');
    finalScoreEl.textContent = 'Score: ' + state.score;
    gameOverScreen.hidden = false;
  }

  playBtn.addEventListener('click', startGame);
  againBtn.addEventListener('click', startGame);

  // --- Input -----------------------------------------------------------
  // Net direction is (down - up); holding both cancels out rather than
  // leaving one input "stuck" winning arbitrarily.
  function netDirection() {
    const up = state.keys.up || state.touch.up;
    const down = state.keys.down || state.touch.down;
    return (down ? 1 : 0) - (up ? 1 : 0);
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      state.keys.up = true;
      e.preventDefault();
    } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
      state.keys.down = true;
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') state.keys.up = false;
    else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') state.keys.down = false;
  });
  // Losing keyboard focus (alt-tab, devtools, etc.) must not leave a key
  // latched "held" forever.
  window.addEventListener('blur', () => {
    state.keys.up = false;
    state.keys.down = false;
    state.touch.up = false;
    state.touch.down = false;
    btnUp.classList.remove('held');
    btnDown.classList.remove('held');
  });

  function bindHold(btn, prop) {
    const clear = () => { state.touch[prop] = false; btn.classList.remove('held'); };
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      btn.setPointerCapture(e.pointerId);
      state.touch[prop] = true;
      btn.classList.add('held');
    });
    btn.addEventListener('pointerup', clear);
    btn.addEventListener('pointercancel', clear);
    btn.addEventListener('lostpointercapture', clear);
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  bindHold(btnUp, 'up');
  bindHold(btnDown, 'down');

  // --- Pause on lost focus ----------------------------------------------
  // Freezing the loop (rather than just hiding an overlay) means no time
  // passes while hidden, so no ribbon can silently cross the miss line.
  function syncPause() {
    const shouldPause = document.hidden || !document.hasFocus();
    if (state.screen !== 'playing') { pauseOverlay.hidden = true; return; }
    state.paused = shouldPause;
    pauseOverlay.hidden = !shouldPause;
  }
  document.addEventListener('visibilitychange', syncPause);
  window.addEventListener('blur', syncPause);
  window.addEventListener('focus', syncPause);

  // --- Ribbons -----------------------------------------------------------
  function spawnRibbon() {
    const height = clamp(H * 0.24, 46, 130);
    const width = clamp(W * 0.03, 14, 26);
    const margin = height / 2 + 6;
    state.ribbons.push({
      x: W + width,
      y: randBetween(margin, H - margin),
      width,
      height,
      color: RIBBON_COLORS[Math.floor(Math.random() * RIBBON_COLORS.length)],
      speed: W * 0.42,
      resolved: null, // null | 'cut' | 'miss'
    });
  }

  function spawnCutEffect(ribbon) {
    state.effects.push({
      type: 'cut',
      x: ribbon.x, y: ribbon.y, width: ribbon.width, height: ribbon.height,
      color: ribbon.color,
      t: 0,
      dur: reducedMotion ? 0.25 : 0.45,
    });
  }

  function spawnMissEffect(ribbon) {
    state.effects.push({
      type: 'miss',
      x: Math.max(ribbon.x, 8), y: ribbon.y,
      t: 0,
      dur: reducedMotion ? 0.3 : 0.5,
    });
  }

  function updateRibbons(dt) {
    const px = planeX();
    const pHalfLen = planeHalfLen();
    const pHalfH = planeHalfHeight();
    const planeTop = state.planeY - pHalfH;
    const planeBottom = state.planeY + pHalfH;

    for (const r of state.ribbons) {
      r.x -= r.speed * dt;

      if (!r.resolved) {
        const overlapsX = r.x <= px + pHalfLen && r.x + r.width >= px - pHalfLen;
        if (overlapsX) {
          const ribbonTop = r.y - r.height / 2;
          const ribbonBottom = r.y + r.height / 2;
          if (ribbonTop <= planeBottom && ribbonBottom >= planeTop) {
            r.resolved = 'cut';
            state.score += 1;
            updateHud();
            spawnCutEffect(r);
          }
        }
      }

      if (!r.resolved && r.x + r.width < 0) {
        r.resolved = 'miss';
        state.misses += 1;
        updateHud();
        spawnMissEffect(r);
      }
    }

    state.ribbons = state.ribbons.filter((r) => r.x + r.width > -40);

    if (state.misses >= MAX_MISSES) {
      endGame();
    }
  }

  function updateEffects(dt) {
    for (const fx of state.effects) fx.t += dt;
    state.effects = state.effects.filter((fx) => fx.t < fx.dur);
  }

  // --- Update / draw loop -------------------------------------------------
  function update(dt) {
    const dir = netDirection();
    const speed = H * 1.15;
    state.planeY = clamp(state.planeY + dir * speed * dt, planeMinY(), planeMaxY());

    state.spawnTimer += dt;
    if (state.spawnTimer >= state.nextSpawnIn) {
      state.spawnTimer = 0;
      state.nextSpawnIn = randBetween(0.9, 1.6);
      spawnRibbon();
    }

    updateRibbons(dt);
    updateEffects(dt);
  }

  function drawPlane() {
    const x = planeX();
    const y = state.planeY;
    const L = planeHalfLen() * 2;
    const Hh = planeHalfHeight() * 2;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x + L * 0.5, y);
    ctx.lineTo(x - L * 0.1, y - Hh * 0.5);
    ctx.lineTo(x - L * 0.5, y - Hh * 0.18);
    ctx.lineTo(x - L * 0.32, y);
    ctx.lineTo(x - L * 0.5, y + Hh * 0.18);
    ctx.lineTo(x - L * 0.1, y + Hh * 0.5);
    ctx.closePath();
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + L * 0.52, y, 3, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawRibbon(r) {
    if (r.resolved === 'cut' || r.resolved === 'miss') return;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 3;
    const top = r.y - r.height / 2;
    const bottom = r.y + r.height / 2;
    const notch = r.width * 0.6;
    ctx.beginPath();
    ctx.moveTo(r.x, top);
    ctx.lineTo(r.x + r.width, top);
    ctx.lineTo(r.x + r.width - notch, r.y);
    ctx.lineTo(r.x + r.width, bottom);
    ctx.lineTo(r.x, bottom);
    ctx.closePath();
    ctx.stroke();
  }

  function drawCutEffect(fx) {
    const p = fx.t / fx.dur;
    ctx.strokeStyle = fx.color;
    ctx.lineWidth = 3;
    if (reducedMotion) {
      // Reduced motion: a brief static highlight instead of the halves
      // flying apart.
      ctx.globalAlpha = 1 - p;
      ctx.strokeRect(fx.x - fx.width / 2, fx.y - fx.height / 2, fx.width * 1.6, fx.height);
      ctx.globalAlpha = 1;
      return;
    }
    const spread = p * 22;
    const fade = 1 - p;
    ctx.globalAlpha = fade;
    // top half drifts up-left, bottom half drifts down-left
    ctx.beginPath();
    ctx.moveTo(fx.x, fx.y - spread - 2);
    ctx.lineTo(fx.x + fx.width, fx.y - spread - 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(fx.x, fx.y + spread + 2);
    ctx.lineTo(fx.x + fx.width, fx.y + spread + 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawMissEffect(fx) {
    const p = fx.t / fx.dur;
    const size = 14;
    ctx.globalAlpha = reducedMotion ? (p < 1 ? 1 : 0) : 1 - p;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(fx.x - size, fx.y - size);
    ctx.lineTo(fx.x + size, fx.y + size);
    ctx.moveTo(fx.x + size, fx.y - size);
    ctx.lineTo(fx.x - size, fx.y + size);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    if (state.screen === 'start') return;
    for (const r of state.ribbons) drawRibbon(r);
    drawPlane();
    for (const fx of state.effects) {
      if (fx.type === 'cut') drawCutEffect(fx);
      else drawMissEffect(fx);
    }
  }

  let lastTime = null;
  function loop(ts) {
    if (lastTime === null) lastTime = ts;
    let dt = (ts - lastTime) / 1000;
    lastTime = ts;
    dt = Math.min(dt, 0.05);

    if (state.screen === 'playing' && !state.paused) {
      update(dt);
    }
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
