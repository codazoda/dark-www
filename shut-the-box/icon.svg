<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#000"/>
  <!-- Die showing 3 (diagonal), tilted left -->
  <g transform="translate(190,220) rotate(-18)">
    <rect x="-90" y="-90" width="180" height="180" fill="#000" stroke="#fff" stroke-width="28"/>
