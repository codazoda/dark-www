<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<title>Shut the Box</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 12px;
    background: #000;
    color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -webkit-tap-highlight-color: transparent;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 2px solid #fff;
    border-radius: 0;
    cursor: pointer;
  }
  button:focus-visible { outline: 2px dashed #fff; outline-offset: 3px; }

  /* Tiles: twelve tall rectangles, number centered near the top. */
  #tiles { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; }
  .tile {
    aspect-ratio: 3 / 4;
    max-height: 22vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: .3em;
    font-size: clamp(14px, 2.4vw, 28px);
  }
  /* Shut: outline and number both darken to 25% visible (not gone), tile keeps its space and stays clickable. */
  .tile[aria-pressed="true"] { border-color: rgba(255, 255, 255, .25); }
  .tile[aria-pressed="true"] span { opacity: .25; }

  /* Dice box: fills what's left below the tiles. */
  #box {
    flex: 1;
    min-height: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  #prompt { letter-spacing: .2em; font-size: clamp(12px, 2.4vw, 20px); }
  #instructions {
    display: block;
    font-size: clamp(11px, 2vw, 14px);
    color: rgba(255, 255, 255, .6);
    letter-spacing: normal;
    max-width: 32em;
    text-align: center;
  }
  #dice { display: none; gap: 10vmin; }
  #box.rolled #dice { display: flex; }
  #box.rolled #prompt { display: none; }
  #box.rolled #instructions { display: none; }
  /* Rolling: dice stay hidden a moment before the new roll appears, so a repeat of the same numbers still reads as a fresh roll. */
  #box.rolling #prompt { display: none; }
  #box.rolling #instructions { display: none; }
  .die {
    width: clamp(72px, 26vmin, 160px);
    aspect-ratio: 1;
    border: 2px solid #fff;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 9%;
    gap: 4%;
  }
  .pip { border-radius: 50%; background: #fff; visibility: hidden; }
  .pip.on { visibility: visible; }

  #clear { align-self: center; padding: .6em 2em; letter-spacing: .2em; }

  #stats {
    text-align: center;
    font-size: clamp(11px, 2vw, 14px);
    line-height: 1.7;
    color: rgba(255, 255, 255, .6);
  }

  /* Twelve tiles across a phone are too thin to tap; wrap to two rows of six. */
  @media (max-width: 600px) {
    #tiles { grid-template-columns: repeat(6, 1fr); }
    .tile { font-size: clamp(16px, 5vw, 28px); }
  }
</style>
</head>
<body>
  <div id="tiles"></div>
  <button id="box" type="button" aria-label="Roll the dice">
    <span id="instructions">Tap tiles that add up to your roll to shut them. Score is a sum of open tiles. Empty the board to win. Stuck? CLEAR starts a new round.</span>
    <span id="prompt">CLICK TO ROLL</span>
    <span id="dice" role="img" aria-label="No dice rolled yet"></span>
  </button>
  <button id="clear" type="button">CLEAR</button>
  <div id="stats">
    <div id="statScore">Score: &ndash;</div>
    <div id="statSummary">Best: &ndash; &middot; Games: 0 &middot; Boxes shut: 0</div>
    <div id="statStreak">Streak: 0 days</div>
  </div>
<script>
  var STATS_KEY = "shutTheBox.stats";
  var LEGACY_SESSION_KEY = "shutTheBox.session";
  var LEGACY_RECOVERY_KEY = "shutTheBox.recovery";
  var DAY_MS = 24 * 60 * 60 * 1000;

  // Pip slots lit for each face, as indexes into a 3x3 grid read left to right.
  var FACES = [[4], [0, 8], [0, 4, 8], [0, 2, 6, 8], [0, 2, 4, 6, 8], [0, 2, 3, 5, 6, 8]];

  var box = document.getElementById('box');
  var diceEl = document.getElementById('dice');
  var tilesEl = document.getElementById('tiles');
  var statScoreEl = document.getElementById('statScore');
  var statSummaryEl = document.getElementById('statSummary');
  var statStreakEl = document.getElementById('statStreak');

  // Stats are opt-in and local only: no round is recorded until CLEAR is pressed with at least one roll behind it.
  var stats = { best: null, games: 0, boxesShut: 0, streak: 0, lastPlayedDate: '' };
  var rolledSinceClear = false;

  function loadJSON(key) {
    try {
      return JSON.parse(localStorage.getItem(key));
    } catch (e) {
      return null;
    }
  }

  // Defaults every field independently so a corrupt or partial record can't block loading.
  function sanitizeStats(obj) {
    if (!obj || typeof obj !== 'object') return null;
    return {
      best: (typeof obj.best === 'number' && isFinite(obj.best) && obj.best >= 0) ? obj.best : null,
      games: (typeof obj.games === 'number' && isFinite(obj.games) && obj.games >= 0) ? Math.floor(obj.games) : 0,
      boxesShut: (typeof obj.boxesShut === 'number' && isFinite(obj.boxesShut) && obj.boxesShut >= 0) ? Math.floor(obj.boxesShut) : 0,
      streak: (typeof obj.streak === 'number' && isFinite(obj.streak) && obj.streak >= 0) ? Math.floor(obj.streak) : 0,
      lastPlayedDate: (typeof obj.lastPlayedDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(obj.lastPlayedDate)) ? obj.lastPlayedDate : ''
    };
  }

  function saveStats() {
    try {
      localStorage.setItem(STATS_KEY, JSON.stringify({
        best: stats.best,
        games: stats.games,
        boxesShut: stats.boxesShut,
        streak: stats.streak,
        lastPlayedDate: stats.lastPlayedDate
      }));
      return true;
    } catch (e) {
      // Storage unavailable (e.g. private browsing quota) — stats just won't persist.
      return false;
    }
  }

  // One-time migration from the retired 24-hour/7-day tiers: take whichever legacy
  // record expired later (even if both are already expired), then drop the old keys.
  function migrateLegacyStats() {
    var session = loadJSON(LEGACY_SESSION_KEY);
    var recovery = loadJSON(LEGACY_RECOVERY_KEY);
    if (!session && !recovery) return false;
    var sessionExpiry = (session && typeof session.expiresAt === 'number') ? session.expiresAt : -Infinity;
    var recoveryExpiry = (recovery && typeof recovery.expiresAt === 'number') ? recovery.expiresAt : -Infinity;
    var chosen = recoveryExpiry > sessionExpiry ? recovery : session;
    var sanitized = sanitizeStats(chosen);
    if (!sanitized) return false;
    stats = sanitized;
    if (saveStats()) {
      try {
        localStorage.removeItem(LEGACY_SESSION_KEY);
        localStorage.removeItem(LEGACY_RECOVERY_KEY);
      } catch (e) {
        // Non-fatal: legacy keys just linger unused.
      }
    }
    return true;
  }

  // Calendar-date arithmetic in UTC millis so DST shifts never distort the day count.
  function dateToUTCms(dateStr) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr);
    if (!m) return null;
    var y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
    var ms = Date.UTC(y, mo - 1, d);
    var check = new Date(ms);
    if (check.getUTCFullYear() !== y || check.getUTCMonth() !== mo - 1 || check.getUTCDate() !== d) return null;
    return ms;
  }

  function renderStats() {
    var scoreText = String(computeScore());
    var bestText = stats.best === null ? '–' : String(stats.best);
    statScoreEl.textContent = 'Score: ' + scoreText;
    statSummaryEl.textContent = 'Best: ' + bestText + ' · Games: ' + stats.games + ' · Boxes shut: ' + stats.boxesShut;
    statStreakEl.textContent = 'Streak: ' + stats.streak + ' day' + (stats.streak === 1 ? '' : 's');
  }

  function todayString() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function computeScore() {
    var t = tilesEl.children;
    var score = 0;
    for (var i = 0; i < t.length; i++) {
      if (t[i].getAttribute('aria-pressed') !== 'true') score += i + 1;
    }
    return score;
  }

  function recordRound() {
    var score = computeScore();
    stats.games += 1;
    stats.best = stats.best === null ? score : Math.min(stats.best, score);
    if (score === 0) stats.boxesShut += 1;
    var today = todayString();
    var lastMs = dateToUTCms(stats.lastPlayedDate);
    var todayMs = dateToUTCms(today);
    if (lastMs === todayMs) {
      // Same local day: leave the streak unchanged.
    } else if (lastMs !== null && todayMs - lastMs === DAY_MS) {
      stats.streak += 1;
    } else {
      // First-ever round, a missed day, an invalid stored date, or the clock moving backward.
      stats.streak = 1;
    }
    stats.lastPlayedDate = today;
    saveStats();
  }

  function initStats() {
    var existing = sanitizeStats(loadJSON(STATS_KEY));
    if (existing) {
      stats = existing;
    } else {
      migrateLegacyStats();
    }
    renderStats();
  }

  for (var n = 1; n <= 12; n++) {
    tilesEl.appendChild(makeTile(n));
  }

  initStats();

  function makeTile(n) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tile';
    b.setAttribute('aria-pressed', 'false');
    var label = document.createElement('span');
    label.textContent = n;
    b.appendChild(label);
    b.addEventListener('click', function () {
      // No rules here: a shut tile opens again, so a misclick costs nothing.
      var shut = b.getAttribute('aria-pressed') === 'true';
      b.setAttribute('aria-pressed', shut ? 'false' : 'true');
      renderStats();
    });
    return b;
  }

  var dice = [makeDie(), makeDie()];

  function makeDie() {
    var d = document.createElement('span');
    d.className = 'die';
    for (var i = 0; i < 9; i++) {
      var p = document.createElement('span');
      p.className = 'pip';
      d.appendChild(p);
    }
    diceEl.appendChild(d);
    return d;
  }

  function draw(die, face) {
    var on = FACES[face - 1];
    for (var i = 0; i < 9; i++) {
      die.children[i].className = on.indexOf(i) > -1 ? 'pip on' : 'pip';
    }
  }

  function rnd() {
    return Math.floor(Math.random() * 6) + 1;
  }

  var rollTimer = null;

  function roll() {
    if (rollTimer) clearTimeout(rollTimer);
    rolledSinceClear = true;
    // Hide whatever's showing first, so back-to-back rolls of the same numbers still look like something happened.
    box.className = 'rolling';
    box.setAttribute('aria-label', 'Rolling dice');
    diceEl.setAttribute('aria-label', 'Rolling dice');
    rollTimer = setTimeout(function () {
      rollTimer = null;
      var a = rnd(), b = rnd();
      draw(dice[0], a);
      draw(dice[1], b);
      diceEl.setAttribute('aria-label', 'Dice: ' + a + ' and ' + b);
      box.setAttribute('aria-label', 'Roll the dice. Showing ' + a + ' and ' + b + '.');
      box.className = 'rolled';
    }, 200);
  }

  function clear() {
    if (rollTimer) {
      clearTimeout(rollTimer);
      rollTimer = null;
    }
    if (rolledSinceClear) {
      recordRound();
    }
    rolledSinceClear = false;
    var t = tilesEl.children;
    for (var i = 0; i < t.length; i++) {
      t[i].setAttribute('aria-pressed', 'false');
    }
    renderStats();
    box.className = '';
    box.setAttribute('aria-label', 'Roll the dice');
    diceEl.setAttribute('aria-label', 'No dice rolled yet');
  }

  box.addEventListener('click', roll);
  document.getElementById('clear').addEventListener('click', clear);

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    // A focused button owns these keys: Enter on a tile shuts it, it doesn't roll.
    if (e.target && e.target.closest && e.target.closest('button')) return;
    e.preventDefault();
    roll();
  });
</script>
<script src="https://counter.joeldare.com/consentless.js" async></script>
</body>
</html>
