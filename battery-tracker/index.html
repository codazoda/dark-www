<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<title>Battery Tracker</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 12px;
    background: #000;
    color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  h1 {
    font-size: clamp(16px, 4vw, 22px);
    letter-spacing: .1em;
    margin: 0 0 16px;
  }
  input, select, button {
    font: inherit;
    color: inherit;
    background: #000;
    border: 2px solid #fff;
    border-radius: 0;
  }
  button { cursor: pointer; }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px dashed #fff;
    outline-offset: 2px;
  }

  #add {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  #add select { flex: 0 0 auto; padding: .5em; }
  #add button { flex: 0 0 auto; padding: .5em 1em; letter-spacing: .1em; }

  .group { margin-bottom: 18px; }
  .group h2 {
    font-size: clamp(13px, 3vw, 15px);
    letter-spacing: .15em;
    color: rgba(255, 255, 255, .6);
    margin: 0 0 8px;
    text-transform: uppercase;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255, 255, 255, .2);
  }
  .row .size {
    flex: 0 0 auto;
    min-width: 3.2em;
    color: rgba(255, 255, 255, .6);
  }
  .row input.label {
    flex: 0 0 5em;
    min-width: 0;
    border: none;
    border-bottom: 1px solid rgba(255, 255, 255, .4);
    padding: .3em 0;
  }
  .row input.location {
    flex: 1 1 auto;
    min-width: 0;
    border: none;
    border-bottom: 1px solid rgba(255, 255, 255, .4);
    padding: .3em .3em;
  }
  .row button.return {
    flex: 0 0 auto;
    padding: .3em .6em;
    font-size: .85em;
  }
  .row button.remove {
    flex: 0 0 auto;
    padding: .3em .6em;
    border-color: rgba(255, 255, 255, .4);
    color: rgba(255, 255, 255, .6);
  }

  #empty {
    color: rgba(255, 255, 255, .6);
    padding: 20px 0;
  }

  @media (max-width: 480px) {
    .row { flex-wrap: wrap; }
    .row .size { order: 1; }
    .row input.label { order: 2; }
    .row input.location { order: 4; flex: 1 1 100%; }
    .row button.return { order: 5; }
    .row button.remove { order: 3; margin-left: auto; }
  }
</style>
</head>
<body>
  <h1>BATTERY TRACKER</h1>
  <div id="add">
    <select id="sizeSelect" aria-label="Battery size">
      <option value="AA">AA</option>
      <option value="AAA">AAA</option>
      <option value="C">C</option>
      <option value="D">D</option>
      <option value="9V">9V</option>
      <option value="Coin">Coin</option>
    </select>
    <button id="addBtn" type="button">Add battery</button>
  </div>
  <div id="list"></div>
  <p id="empty" hidden>No batteries yet — pick a size and tap "Add battery".</p>
<script>
  var STORAGE_KEY = 'batteryTracker.batteries';
  var ORGANIZER = 'Organizer';

  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var sizeSelect = document.getElementById('sizeSelect');
  var addBtn = document.getElementById('addBtn');

  var batteries = load();

  function load() {
    try {
      var arr = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(batteries));
    } catch (e) {
      // Storage unavailable (e.g. private browsing quota) — list just won't persist.
    }
  }

  function nextLabel(size) {
    var count = 0;
    for (var i = 0; i < batteries.length; i++) {
      if (batteries[i].size === size) count++;
    }
    return String(count + 1);
  }

  function addBattery() {
    var size = sizeSelect.value;
    batteries.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      size: size,
      label: nextLabel(size),
      location: ORGANIZER
    });
    save();
    render();
  }

  function setLocation(id, value) {
    var b = findById(id);
    if (!b) return;
    b.location = value.trim() || ORGANIZER;
    save();
    render();
  }

  function setLabel(id, value) {
    var b = findById(id);
    if (!b) return;
    b.label = value.trim();
    save();
  }

  function removeBattery(id) {
    batteries = batteries.filter(function (b) { return b.id !== id; });
    save();
    render();
  }

  function findById(id) {
    for (var i = 0; i < batteries.length; i++) {
      if (batteries[i].id === id) return batteries[i];
    }
    return null;
  }

  function groupByLocation() {
    var groups = {};
    var order = [];
    for (var i = 0; i < batteries.length; i++) {
      var loc = batteries[i].location || ORGANIZER;
      if (!groups[loc]) {
        groups[loc] = [];
        order.push(loc);
      }
      groups[loc].push(batteries[i]);
    }
    order.sort(function (a, b) {
      if (a === ORGANIZER) return -1;
      if (b === ORGANIZER) return 1;
      return a.localeCompare(b);
    });
    return { groups: groups, order: order };
  }

  function render() {
    listEl.textContent = '';
    var grouped = groupByLocation();
    emptyEl.hidden = batteries.length > 0;

    grouped.order.forEach(function (loc) {
      var section = document.createElement('div');
      section.className = 'group';

      var h2 = document.createElement('h2');
      h2.textContent = loc + ' (' + grouped.groups[loc].length + ')';
      section.appendChild(h2);

      grouped.groups[loc].forEach(function (b) {
        section.appendChild(makeRow(b));
      });

      listEl.appendChild(section);
    });
  }

  function makeRow(b) {
    var row = document.createElement('div');
    row.className = 'row';

    var size = document.createElement('span');
    size.className = 'size';
    size.textContent = b.size;
    row.appendChild(size);

    var label = document.createElement('input');
    label.className = 'label';
    label.type = 'text';
    label.value = b.label;
    label.setAttribute('aria-label', b.size + ' battery label');
    label.addEventListener('change', function () { setLabel(b.id, label.value); });
    row.appendChild(label);

    var location = document.createElement('input');
    location.className = 'location';
    location.type = 'text';
    location.value = b.location;
    location.setAttribute('aria-label', 'Location');
    location.addEventListener('focus', function () { location.value = ''; });
    location.addEventListener('change', function () { setLocation(b.id, location.value); });
    row.appendChild(location);

    if (b.location !== ORGANIZER) {
      var ret = document.createElement('button');
      ret.className = 'return';
      ret.type = 'button';
      ret.textContent = 'Return';
      ret.addEventListener('click', function () { setLocation(b.id, ORGANIZER); });
      row.appendChild(ret);
    }

    var remove = document.createElement('button');
    remove.className = 'remove';
    remove.type = 'button';
    remove.textContent = '×';
    remove.setAttribute('aria-label', 'Remove ' + b.size + ' ' + b.label);
    remove.addEventListener('click', function () { removeBattery(b.id); });
    row.appendChild(remove);

    return row;
  }

  addBtn.addEventListener('click', addBattery);

  render();
</script>
</body>
</html>
