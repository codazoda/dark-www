<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    background: #000;
    color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    line-height: 1.5;
  }
  main { max-width: 34em; margin: 0 auto; }
  h1 { font-size: 1em; letter-spacing: .2em; font-weight: normal; margin: 1em 0 2em; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: 0 0 .4em; }
  a { color: inherit; text-decoration: none; display: block; border: 2px solid #fff; padding: .6em .8em; }
  a:hover, a:focus-visible { background: #fff; color: #000; }
  a:focus-visible { outline: 2px dashed #fff; outline-offset: 3px; }
  p { opacity: .6; margin: 2em 0 0; }
</style>
</head>
<body>
<main>
<h1>DARK</h1>
<ul>
<li><a href="battery-tracker/">Battery Tracker</a></li>
<li><a href="shut-the-box/">Shut the Box</a></li>
</ul>
<p>Prototypes from a software factory. Rough on purpose.</p>
</main>
</body>
</html>
